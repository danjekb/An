name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-oneui
      - ksu-next-aosp
      - main

permissions:
  contents: write  # Kluczowe: daje skryptowi prawa do tworzenia wydań

jobs:
  build:
    name: Build Flashable ZIP
    runs-on: ubuntu-24.04

    env:
      JOBS: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev python3 rsync sed tar unzip zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: clang-r530567-${{ runner.os }}-v1

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Build kernel and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Przekazujemy token bezpośrednio do basha
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ./build_kernel_zip.sh
