name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      -ksu-test

permissions:
  contents: write

jobs:
  build:
    name: Build Flashable ZIP
    runs-on: ubuntu-24.04

    env:
      JOBS: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # === 1. NAJPIERW CAŁKOWITE CZYSZCZENIE ZMIAN UNAME ===
      - name: Revert Fake Uname Changes
        run: |
          echo "=== Cofanie zmian w strukturze uname ==="
          
          if [ -f "init/Kconfig" ]; then
            git checkout -- init/Kconfig
            echo "Przywrócono init/Kconfig do stanu czystego."
          fi

          if [ -f "kernel/sys.c" ]; then
            git checkout -- kernel/sys.c
            echo "Przywrócono kernel/sys.c do stanu czystego."
          fi

          if [ -f "arch/arm64/configs/vendor/a52sxq_kor_single_defconfig" ]; then
            git checkout -- arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
            echo "Przywrócono defconfig do stanu czystego."
          fi

      # === 2. DOPIERO TERAZ NAKŁADANIE GŁÓWNEGO PATCHA SUSFS ===
      - name: Apply SUSFS patch
        run: |
          set -euo pipefail
          PATCH_FILE="susfs_patch_to_5.4.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "Brak pliku $PATCH_FILE - przerywam!"
            exit 1
          fi

          echo "=== git apply --check ==="
          if git apply --check "$PATCH_FILE"; then
            echo "git apply --check OK, applying patch with git apply"
            git apply "$PATCH_FILE"
            echo "Patch SUSFS nałożony pomyślnie (git apply)"
          else
            echo "git apply --check failed — trying git apply --reject to produce .rej files for inspection"
            git apply --reject --whitespace=fix "$PATCH_FILE" || true

            echo "Running patch fallback (dry-run) to try patch -p1 (for non-git-format patches)"
            if patch --dry-run -p1 < "$PATCH_FILE"; then
              patch -p1 < "$PATCH_FILE"
              echo "Patch SUSFS nałożony pomyślnie (patch -p1)"
            else
              echo "patch --dry-run FAILED. Saving rejects for inspection."
            fi

            echo "===== REJECTS (if any) ====="
            find . -name '*.rej' -print -exec sed -n '1,200p' {} \;
            echo "===== END REJECTS ====="

            echo "Please inspect .rej files — the patch likely targets a different kernel commit or file layout."
            exit 1
          fi

      - name: Upload patch rejects (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: |
            **/*.rej
            **/*.orig

      # === 3. URUCHAMIANIE SKRYPTU Z INLINE HOOKAMI SUSFS + POPRAWKA DO REJECTA ===
      - name: Run SUSFS Inline Hook Patches
        run: |
          echo "=== Nadawanie uprawnień i uruchamianie skryptu susfs_inline_hook_patches.sh ==="
          chmod +x susfs_inline_hook_patches.sh
          ./susfs_inline_hook_patches.sh

          echo "=== Ręczne poprawianie rejecta w fs/proc/task_mmu.c ==="
          if [ -f "fs/proc/task_mmu.c" ]; then
            if ! grep -q "bypass_orig_flow" fs/proc/task_mmu.c; then
              sed -i '/show_smap_vma_flags(m, vma);/i #ifdef CONFIG_KSU_SUSFS_SUS_MAP\nbypass_orig_flow:\n#endif' fs/proc/task_mmu.c
              echo "[+] Pomyślnie zaaplikowano brakujący fragment do fs/proc/task_mmu.c!"
            else
              echo "[-] fs/proc/task_mmu.c był już zmodyfikowany, pomijam."
            fi
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev python3 rsync sed tar unzip zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: clang-r530567-${{ runner.os }}-v1

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Build kernel and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          type -p gh >/dev/null || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install -y gh)
          
          chmod +x build_kernel_zip.sh
          ./build_kernel_zip.sh || true
          
          if ls *.zip >/dev/null 2>&1; then
            echo "Sukces: Plik ZIP znaleziony!"
          else
            echo "Błąd: Plik ZIP nie powstał!"
            exit 1
          fi
