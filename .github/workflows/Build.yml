name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-oneui
      - ksu-next-aosp
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Flashable ZIP
    runs-on: ubuntu-24.04

    env:
      JOBS: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Inject Fake Uname 5.10 Patches
        run: |
          echo "=== Automatyczne wstrzykiwanie poprawek Fake Uname ==="
          
          # 1. Zabezpieczenie mm/Kconfig przed błędami parsera (brak nowej linii na EOF)
          if [ -f "mm/Kconfig" ]; then
            echo "" >> mm/Kconfig
            echo "[OK] mm/Kconfig zabezpieczony pustą linią."
          fi

          # 2. Patchowanie init/Kconfig
          if [ -f "init/Kconfig" ]; then
            if ! grep -q "FAKE_UNAME_NONE" init/Kconfig; then
              echo "[+] Patchowanie init/Kconfig..."
              cat << 'EOF' > kconfig_patch.tmp
          choice
              prompt "Fake uname kernel version"
              default FAKE_UNAME_NONE
              help
                Kernel side spoof for BPF.
          
          config FAKE_UNAME_NONE
              bool "None"
              help
                Don't spoof uname version.
          
          config FAKE_UNAME_5_4
              bool "5.4"
          
          config FAKE_UNAME_5_10
              bool "5.10"
          
          config FAKE_UNAME_5_15
              bool "5.15"
          
          config FAKE_UNAME_6_1
              bool "6.1"
          
          config FAKE_UNAME_6_6
              bool "6.6"
          
          config FAKE_UNAME_6_12
              bool "6.12"
          
          endchoice
          EOF
              sed -i '/source "block\/Kconfig"/r kconfig_patch.tmp' init/Kconfig
              rm kconfig_patch.tmp
              echo "[OK] init/Kconfig zaktualizowany."
            else
              echo "[!] Patch Kconfig już istnieje. Pomijam."
            fi
          else
            echo "[-] Błąd: Nie znaleziono init/Kconfig!" && exit 1
          fi

          # 3. Czyszczenie i patchowanie kernel/sys.c (Pełna automatyzacja)
          if [ -f "kernel/sys.c" ]; then
            if ! grep -q "CONFIG_FAKE_UNAME_" kernel/sys.c; then
              echo "[+] Usuwanie starych definicji i duplikatów newuname z kernel/sys.c..."
              
              # Python bezlitośnie czyści wszelkie zduplikowane, stare lub urwane bloki SYSCALL_DEFINE1(newuname...)
              python3 -c "
          with open('kernel/sys.c', 'r') as f:
              content = f.read()
          import re
          # Wyrażenie regularne usuwające całe bloki funkcji newuname wraz z klamrami
          clean_content = re.sub(r'SYSCALL_DEFINE1\s*\(\s*newuname\s*,[\s\S]*?\}', '', content)
          with open('kernel/sys.c', 'w') as f:
              f.write(clean_content)
          "
              
              echo "[+] Doklejanie poprawnego kodu Fake Uname na koniec kernel/sys.c..."
              cat << 'EOF' >> kernel/sys.c
          
          #ifdef CONFIG_FAKE_UNAME_5_4
          #define FAKE_UNAME "5.4.300"
          #elif defined(CONFIG_FAKE_UNAME_5_10)
          #define FAKE_UNAME "5.10.200"
          #elif defined(CONFIG_FAKE_UNAME_5_15)
          #define FAKE_UNAME "5.15.140"
          #elif defined(CONFIG_FAKE_UNAME_6_1)
          #define FAKE_UNAME "6.1.75"
          #elif defined(CONFIG_FAKE_UNAME_6_6)
          #define FAKE_UNAME "6.6.14"
          #elif defined(CONFIG_FAKE_UNAME_6_12)
          #define FAKE_UNAME "6.12.1"
          #endif
          
          SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)
          {
          	struct new_utsname tmp;
          
          	down_read(&uts_sem);
          	memcpy(&tmp, utsname(), sizeof(tmp));
          	up_read(&uts_sem);
          
          #ifdef FAKE_UNAME
          	if (current->flags & 0x00000002) {
          		strscpy(tmp.release, FAKE_UNAME, sizeof(tmp.release));
          	}
          #endif
          
          	if (copy_to_user(name, &tmp, sizeof(tmp)))
          		return -EFAULT;
          
          	return 0;
          }
          EOF
              echo "[OK] kernel/sys.c naprawiony i spatchowany."
            else
              echo "[!] Patch sys.c już istnieje. Pomijam."
            fi
          else
            echo "[-] Błąd: Nie znaleziono kernel/sys.c!" && exit 1
          fi

          # 4. Patchowanie defconfigu w poprawnej ścieżce (w folderze vendor)
          DEFCONFIG_PATH="arch/arm64/configs/vendor/a52sxq_kor_single_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            if ! grep -q "CONFIG_FAKE_UNAME_" "$DEFCONFIG_PATH"; then
              echo "[+] Dodawanie flagi CONFIG_FAKE_UNAME_5_10=y do defconfigu..."
              echo "" >> "$DEFCONFIG_PATH"
              echo "# Fake Uname Spoofing for BPF" >> "$DEFCONFIG_PATH"
              echo "CONFIG_FAKE_UNAME_5_10=y" >> "$DEFCONFIG_PATH"
              echo "[OK] Defconfig zaktualizowany."
            else
              echo "[!] Flaga CONFIG_FAKE_UNAME już istnieje w defconfigu. Pomijam."
            fi
          else
            echo "[-] Błąd: Nie znaleziono defconfigu w: $DEFCONFIG_PATH" && exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl dwarves flex git kmod \
            libelf-dev libssl-dev python3 rsync sed tar unzip zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Restore clang cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: clang-r530567-${{ runner.os }}-v1

      - name: Make build script executable
        run: chmod +x build_kernel_zip.sh

      - name: Build kernel and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build_kernel_zip.sh
