name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-oneui
      - ksu-next-aosp
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Flashable ZIP
    runs-on: ubuntu-24.04

    env:
      JOBS: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Inject Fake Uname Patches
        run: |
          echo "=== Automatyczne patchowanie ==="
          
          # Patchowanie init/Kconfig
          if [ -f "init/Kconfig" ]; then
            if ! grep -q "FAKE_UNAME_NONE" init/Kconfig; then
              cat << 'EOF' > kconfig_patch.tmp
          choice
              prompt "Fake uname kernel version"
              default FAKE_UNAME_NONE
              help
                Kernel side spoof for BPF.
          config FAKE_UNAME_NONE
              bool "None"
          config FAKE_UNAME_5_10
              bool "5.10"
          endchoice
          EOF
              sed -i '/source "block\/Kconfig"/r kconfig_patch.tmp' init/Kconfig
              rm kconfig_patch.tmp
            fi
          fi

          # Patchowanie CZYSTEGO kernel/sys.c
          if [ -f "kernel/sys.c" ]; then
            if ! grep -q "CONFIG_FAKE_UNAME_" kernel/sys.c; then
              # Dodanie makr na początek
              echo "#ifdef CONFIG_FAKE_UNAME_5_10" > sys_patch.tmp
              echo "#define FAKE_UNAME \"5.10.200\"" >> sys_patch.tmp
              echo "#endif" >> sys_patch.tmp
              cat sys_patch.tmp kernel/sys.c > kernel/sys.c.new
              mv kernel/sys.c.new kernel/sys.c
              rm sys_patch.tmp
              
              # Wstrzyknięcie kodu w unikalne miejsce
              sed -i '/memcpy(&tmp, utsname(), sizeof(tmp));/a \
          #ifdef CONFIG_FAKE_UNAME_5_10\n\tif (current->flags \& 0x00000002) {\n\t\tstrscpy(tmp.release, FAKE_UNAME, sizeof(tmp.release));\n\t}\n#endif' kernel/sys.c
            fi
          fi

          # Patchowanie defconfigu
          if [ -f "arch/arm64/configs/vendor/a52sxq_kor_single_defconfig" ]; then
            echo "CONFIG_FAKE_UNAME_5_10=y" >> "arch/arm64/configs/vendor/a52sxq_kor_single_defconfig"
          fi

      - name: Build kernel and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Instalacja GitHub CLI
          type -p gh >/dev/null || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y)
          
          chmod +x build_kernel_zip.sh
          # Uruchomienie skryptu
          ./build_kernel_zip.sh || true
          
          # Weryfikacja czy ZIP istnieje
          if ls *.zip >/dev/null 2>&1; then
            echo "Sukces: Plik ZIP znaleziony!"
          else
            echo "Błąd: Plik ZIP nie powstał!"
            exit 1
          fi
